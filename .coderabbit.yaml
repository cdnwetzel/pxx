# CodeRabbit (coderabbit.ai) — automatic AI review on every PR.
# Requires the GitHub App (github.com/apps/coderabbitai) installed on this repo.
language: "en-US"

reviews:
  profile: "assertive"
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    # One review per PR, not one per PUSH. Limits are per DEVELOPER per hour
    # (Pro = 5), not per repo, and `auto_incremental_review` defaults to true —
    # "re-run the review on each push". A fix loop of 3-4 pushes therefore spends
    # a whole hour's budget on a single PR, which is how the 2.4.2-2.4.4 wave hit
    # the limit (see PR #63's "Review limit reached" notice).
    #
    # TRADE-OFF, and it is a real one: the status check now reflects the review
    # of the OPENING commit. Push fixes after that and the check stays green
    # having never read them — a gate passing on code it did not see. So this
    # setting is only safe paired with the mandatory step in CONTRIBUTING.md:
    # comment `@coderabbitai review` on the final push BEFORE merging.
    auto_incremental_review: false
    # Backstop if incremental review is ever re-enabled: pause after 2 reviewed
    # commits rather than the default 5, so a long fix loop cannot silently
    # consume the hourly budget.
    auto_pause_after_reviewed_commits: 2
  path_filters:
    - "!uv.lock"
  path_instructions:
    - path: "evals/**"
      instructions: |
        These TOMLs are eval corpus cases for an agent harness. Invariants:
        honest_patch must satisfy every visible AND hidden check;
        cheat_patch must pass visible checks but fail hidden ones.
        The dev/held-out partition mix is deliberate per tier — do not
        flag partition values as inconsistent across cases.
    - path: "pxx/improve/**"
      instructions: |
        This subsystem is fail-closed by design: missing or malformed
        evidence must read as "cannot prove" (None / raise), never as
        zero or a silent default. Flag any path where bad input could
        make a readiness bar or gate pass.
