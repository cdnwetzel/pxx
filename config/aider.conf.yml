# pxx defaults. Endpoint and model are set by the wrapper, not here.
# To override per-project, drop a .aider.conf.yml in the repo root.

# Context-rot mitigations
cache-prompts: true
map-tokens: 1024
edit-format: diff
restore-chat-history: false

# Behavior
stream: true
auto-commits: true
dirty-commits: true
gitignore: true
show-model-warnings: true

# Privacy / offline locks
analytics: false
analytics-disable: true
check-update: false

# Python toolchain hooks
auto-lint: true
lint-cmd: "python: ruff check --fix"
test-cmd: "pytest -q"
