# Per-model overrides for aider.
# Aider doesn't ship metadata for the Ollama-hosted Devstral, so we set it explicitly.
# Format: https://aider.chat/docs/config/adv-model-settings.html

- name: ollama_chat/devstral:24b
  edit_format: diff
  use_repo_map: true
  use_temperature: false
  extra_params:
    # Devstral's native window is 128K, but the KV cache for that
    # would eat most of the Studio's 36GB. 32K is the sweet spot:
    # large enough for multi-file sessions, small enough to stay snappy.
    num_ctx: 32768

- name: ollama_chat/qwen2.5:32b-instruct-q4_K_M
  edit_format: diff
  use_repo_map: true
  extra_params:
    num_ctx: 16384

- name: ollama_chat/qwen3:4b
  # Neo offline fallback — 8GB ceiling forces tight context
  edit_format: diff
  use_repo_map: true
  extra_params:
    num_ctx: 8192
