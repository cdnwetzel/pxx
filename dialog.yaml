      (psguard ENFORCES) + a data-plane backstop (topology + firewall, because psguard cannot
      packet-inspect a RoCE/NCCL transfer). Shape I propose below.
    answer_a_shape:
      - "New CanonicalAction inference.node_placement, emitted by psrouter when it assigns a request to a multi-node config (PP group / disagg pair). THIS is the event psguard genuinely sees and hash-chains into firm_audit_log - placement + route-config decisions, not raw KV packets."
      - "New invariant (reserve inv-036) + policy in the pol-026 target-allowlist family, extended to the data plane: every endpoint in a placement's node-set must be in the firm private-fabric allowlist (QSFP56 192.168.100.0/24 switchless triangle, TB5 RDMA point-to-point link, mgmt 192.168.111.0/24). Any off-allowlist endpoint fails closed DENY sev-5, enforced at BOTH psrouter route-config load and per-placement."
      - "Honest limit (I will NOT overclaim): psguard is not in the RDMA path, so no-egress is guaranteed TOPOLOGICALLY - bind inter-node transport to the private-fabric interfaces (the QSFP56 triangle is switchless with no gateway = no route off-subnet; TB5 is point-to-point), plus a network egress-deny backstop that extends the fleet-firewall-posture doc. psguard's enforceable contribution = the placement allowlist gate (fails closed) + the placement/route audit rows. Per-KV-packet audit is out of psguard's reach; claiming it would be an aspirational rule with no backing (the bl300/301/302 cleanup lesson)."
