[project]
name = "pxx"
version = "0.1.0"
description = "Personal offline Python coding agent, thin wrapper over aider."
requires-python = ">=3.11,<3.13"
dependencies = [
    # Pinned exact — aider releases weekly and can change pxx's wrapped
    # surfaces (chat modes, --read, --model-settings-file, edit format,
    # exit semantics). Bump deliberately after reading CHANGELOG and
    # spot-checking pxx's touch points. See "Aider upgrade discipline"
    # in CLAUDE.md.
    "aider-chat==0.86.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.7",
]

[project.scripts]
pxx = "pxx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pxx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
