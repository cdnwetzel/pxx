[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pxx"
version = "1.0.0"
description = "Offline-capable aider orchestrator with persistent observation memory"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "pxx"}]
keywords = ["aider", "ai", "coding", "offline", "memory", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Shells",
]
dependencies = [
    "aider-chat>=0.45.0",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/cdnwetzel/pxx"
Documentation = "https://github.com/cdnwetzel/pxx#documentation"
Repository = "https://github.com/cdnwetzel/pxx"
Issues = "https://github.com/cdnwetzel/pxx/issues"

[project.scripts]
pxx = "pxx.cli:main"
pxx-scope-check = "pxx.scope:scope_check_main"

[tool.setuptools]
packages = ["pxx"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
