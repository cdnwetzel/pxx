[project]
name = "pxx"
version = "0.1.0"
description = "Personal offline Python coding agent, thin wrapper over aider."
requires-python = ">=3.11,<3.13"
dependencies = [
    "aider-chat",
]

[project.scripts]
pxx = "pxx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pxx"]
